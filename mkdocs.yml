site_name: Matwerk
site_url: https://nfdi.fiz-karlsruhe.de/matwerk/
repo_url: https://github.com/ISE-FIZKarlsruhe/matwerk
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - ontoink
  - macros:
      module_name: docs/macros
      on_error_fail: true
      j2_block_start_string: '[%'
      j2_block_end_string: '%]'
      j2_variable_start_string: '[['
      j2_variable_end_string: ']]'

nav:
  - Home: index.md
  - Dashboard: https://superset.ise.fiz-karlsruhe.de/superset/dashboard/mse-kg-dashboard/
  - How to add data?: upload.md
  - SPARQL Endpoint: /matwerk/shmarql/
  - RDF Dumps: dumps.md
  - Sample Queries:
      - General Queries: general_queries.md
      - Federated Queries: Federated_queries.md
      - Statistics: statistics.md
      - Named Graphs Statistics: namedgraphsstatistics.md
  - Pipeline:
      - Overview: pipeline/index.md
      - Pipeline Graph: pipeline/pipeline-graph.md
      - Template Processing: pipeline/process-spreadsheets.md
      - Merge: pipeline/merge.md
      - Reasoning: pipeline/reason.md
      - Validation: pipeline/validation.md
      - Harvesters: pipeline/harvesters.md
      - Harvested RDF modelling: pipeline/rdf-files-modelling.md
      - Publish to Virtuoso: pipeline/publish.md
      - Dashboard DAG: pipeline/dashboard.md
      - Dump & Archive: pipeline/dump-and-archive.md
      - CQ Tester: pipeline/cq-tester.md
  - Patterns:
      - Overview: patterns/index.md
      - agent: patterns/agent/pattern.md
      - city: patterns/city/pattern.md
      - collaboration: patterns/collaboration/pattern.md
      - dataportal: patterns/dataportal/pattern.md
      - dataset: patterns/dataset/pattern.md
      - event: patterns/event/pattern.md
      - fdos: patterns/fdos/pattern.md
      - instrument: patterns/instrument/pattern.md
      - largescalefacility: patterns/largescalefacility/pattern.md
      - materials: patterns/materials/pattern.md
      - matwerkiuc: patterns/matwerkiuc/pattern.md
      - matwerkpp: patterns/matwerkpp/pattern.md
      - matwerkta: patterns/matwerkta/pattern.md
      - metadata: patterns/metadata/pattern.md
      - ontologies: patterns/ontologies/pattern.md
      - organization: patterns/organization/pattern.md
      - people: patterns/people/pattern.md
      - process: patterns/process/pattern.md
      - publication: patterns/publication/pattern.md
      - role: patterns/role/pattern.md
      - service: patterns/service/pattern.md
      - software: patterns/software/pattern.md
      - sparql endpoints: patterns/sparql_endpoints/pattern.md
      - temporal: patterns/temporal/pattern.md
      - nfdi matwerk consortium: patterns/value-nfdi-matwerk-consortium/pattern.md
  - Shapes:
      - Overview: shapes/index.md
      - Graph Metadata: shapes/graph-metadata/pattern.md
      - Textual Entity: shapes/textual-entity/pattern.md
      - No Punning: shapes/no-punning/pattern.md
      - Role Bearer: shapes/role-bearer/pattern.md
      - Role Realization: shapes/role-realization/pattern.md
      - Ontology Variant: shapes/ontology-variant/pattern.md
      - Ontology Version: shapes/ontology-version-complex/pattern.md
      - Email Address Value: shapes/email-address/pattern.md
      - URL Instance: shapes/url-instance/pattern.md
  - Verification:
      - SPARQL Checks: verification/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - overrides/assets/stylesheets/extra.css

extra_javascript:
  - overrides/assets/javascripts/open-dashboard-link.js
  - overrides/assets/javascripts/extra.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js
